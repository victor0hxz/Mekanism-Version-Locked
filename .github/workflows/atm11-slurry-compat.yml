name: ATM11 legacy slurry compatibility validation

on:
  push:
    branches:
      - fix/atm11-0.12-legacy-slurry-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Compile and test Mekanism
        run: ./gradlew --no-daemon --stacktrace compileApiJava compileJava test jar
      - name: Upload candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mekanism-version-locked-2.10-candidate
          path: build/libs/*.jar
          if-no-files-found: error
